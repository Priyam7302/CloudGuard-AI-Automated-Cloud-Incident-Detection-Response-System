name: Deploy CloudGuard Backend to AWS Lambda

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy CloudGuard Lambda
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout CloudGuard repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------
      # 3. Prepare Lambda deployment package
      # --------------------------------------------------
      - name: Prepare Lambda package
        shell: bash
        run: |
          set -e

          echo "Preparing CloudGuard Lambda package..."

          cd backend

          if [ -s requirements.txt ]; then
            echo "Installing Python dependencies..."
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt -t .
          else
            echo "requirements.txt is empty. No external dependencies to install."
          fi

          echo "Removing Python cache files..."

          find . -type d -name "__pycache__" -prune -exec rm -rf {} +
          find . -type f -name "*.pyc" -delete

          echo "Creating Lambda ZIP package..."

          zip -r ../cloudguard-backend.zip . \
            -x "*.git*" \
            -x "*.pyc" \
            -x "__pycache__/*"

          cd ..

          echo "Lambda package created:"
          ls -lh cloudguard-backend.zip

      # --------------------------------------------------
      # 4. DEBUG GitHub OIDC claims
      # --------------------------------------------------
      # Temporary step.
      # We are using this to see the exact OIDC claims
      # GitHub is sending to AWS.
      # --------------------------------------------------
      - name: Debug GitHub OIDC claims
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set -e

          echo "Requesting GitHub OIDC token..."

          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Could not obtain GitHub OIDC token."
            exit 1
          fi

          echo "OIDC token received."

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Add Base64 padding if required
          PADDING=$((4 - ${#PAYLOAD} % 4))

          if [ "$PADDING" -ne 4 ]; then
            PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PADDING))"
          fi

          DECODED=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)

          echo ""
          echo "=============================================="
          echo "GitHub OIDC Claims"
          echo "=============================================="

          echo "$DECODED" | jq '{
            iss: .iss,
            aud: .aud,
            sub: .sub,
            repository: .repository,
            repository_owner: .repository_owner,
            ref: .ref,
            workflow: .workflow
          }'

          echo "=============================================="

      # --------------------------------------------------
      # 5. Authenticate to AWS using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::604579607900:role/CloudGuard-GitHubActions-LambdaDeploy
          aws-region: us-east-1

      # --------------------------------------------------
      # 6. Verify AWS identity
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      # --------------------------------------------------
      # 7. Deploy package to CloudGuard Lambda
      # --------------------------------------------------
      - name: Deploy CloudGuard Lambda
        run: |
          set -e

          echo "Deploying CloudGuard backend..."

          aws lambda update-function-code \
            --function-name CloudGuardIAM-EventProcessor-us \
            --zip-file fileb://cloudguard-backend.zip

          echo "CloudGuard Lambda deployment completed."

      # --------------------------------------------------
      # 8. Verify deployed Lambda
      # --------------------------------------------------
      - name: Verify Lambda deployment
        run: |
          set -e

          echo "Lambda information:"

          aws lambda get-function \
            --function-name CloudGuardIAM-EventProcessor-us \
            --query 'Configuration.[FunctionName,Runtime,Handler,LastModified,CodeSize]' \
            --output table

          echo "Deployment verification completed."